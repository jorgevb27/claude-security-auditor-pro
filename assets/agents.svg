<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Agent team: coordinator plans; code and database reviewers work read-only; pentest and visual agent run only after approval inside a safety envelope watched by observer and safety supervisor; analyst correlates; you approve fixes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05100c"/><stop offset="1" stop-color="#0a1620"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>
      .h{font:800 28px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f0fdf4}
      .s{font:500 15px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#94a3b8}
      .n{font:800 16px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f8fafc}
      .d{font:500 12.5px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#cbd5e1}
      .k{font:700 12px ui-monospace,Consolas,Menlo,monospace;letter-spacing:1.5px}
      .c{fill:#0d1b2a;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="640" rx="18" fill="url(#bg)"/>
  <text x="40" y="56" class="h">One team, eight specialists, <tspan fill="#34d399">one safety net</tspan></text>
  <text x="40" y="84" class="s">Read-only work runs in parallel. Live tests run only after your approval, inside a monitored envelope with veto power.</text>

  <!-- 1 scope -->
  <rect x="40" y="120" width="210" height="96" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="152" class="n">📋 Scope &amp; authorization</text>
  <text x="60" y="176" class="d">hosts · environment · test</text>
  <text x="60" y="194" class="d">accounts · allowed modes</text>

  <!-- coordinator -->
  <rect class="c" x="290" y="120" width="210" height="96" rx="14" stroke="#a78bfa"/>
  <text x="310" y="152" class="n">🧭 coordinator</text>
  <text x="310" y="176" class="d">plans tasks, assigns agents,</text>
  <text x="310" y="194" class="d">blocks out-of-scope work</text>
  <line x1="250" y1="168" x2="286" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- read-only lane -->
  <rect x="540" y="110" width="620" height="116" rx="16" fill="#10b981" fill-opacity=".07" stroke="#10b981" stroke-opacity=".5" stroke-dasharray="6 5"/>
  <text x="560" y="134" class="k" fill="#34d399">READ-ONLY · PARALLEL · NO APPROVAL NEEDED</text>
  <rect class="c" x="560" y="146" width="285" height="66" rx="12" stroke="#34d399"/>
  <text x="578" y="172" class="n">🔎 code-reviewer</text>
  <text x="578" y="195" class="d">OWASP/CWE · secrets · deps · file:line</text>
  <rect class="c" x="860" y="146" width="285" height="66" rx="12" stroke="#34d399"/>
  <text x="878" y="172" class="n">🗄️ database-reviewer</text>
  <text x="878" y="195" class="d">grants · least privilege · TLS · queries</text>
  <line x1="500" y1="168" x2="536" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- approval gate -->
  <path d="M395 216 V 270" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="274" width="190" height="50" rx="25" fill="#f59e0b"/>
  <text x="395" y="305" text-anchor="middle" class="n" style="fill:#1c1206">🔒 YOUR APPROVAL</text>
  <line x1="490" y1="299" x2="536" y2="299" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>

  <!-- safety envelope -->
  <rect x="540" y="250" width="620" height="210" rx="16" fill="#ef4444" fill-opacity=".05" stroke="#ef4444" stroke-opacity=".55" stroke-width="2"/>
  <text x="560" y="274" class="k" fill="#f87171">LIVE TESTS · STAGING · ≤1 REQ/S · ≤2 CONCURRENT</text>
  <rect class="c" x="560" y="286" width="285" height="66" rx="12" stroke="#f97316"/>
  <text x="578" y="312" class="n">🎯 pentest</text>
  <text x="578" y="335" class="d">minimal proof · no brute force / DoS</text>
  <rect class="c" x="860" y="286" width="285" height="66" rx="12" stroke="#3b82f6"/>
  <text x="878" y="312" class="n">🖱️ visual-agent</text>
  <text x="878" y="335" class="d">journeys · UI vs server auth · a11y</text>
  <rect class="c" x="560" y="374" width="285" height="70" rx="12" stroke="#22d3ee"/>
  <text x="578" y="400" class="n">📈 observer</text>
  <text x="578" y="424" class="d">errors · latency · CPU · DB locks vs baseline</text>
  <rect x="860" y="374" width="285" height="70" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="878" y="400" class="n">🛑 safety-supervisor</text>
  <text x="878" y="424" class="d" style="fill:#fecaca">checks every test · VETO at any time</text>
  <line x1="845" y1="409" x2="856" y2="409" stroke="#ef4444" stroke-width="2" marker-end="url(#a)"/>

  <!-- analyst -->
  <path d="M850 460 V 494" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1152 179 H 1172 V 520 H 1004" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect class="c" x="700" y="498" width="300" height="104" rx="14" stroke="#a78bfa"/>
  <text x="720" y="530" class="n">🧠 analyst</text>
  <text x="720" y="554" class="d">dedupes · evidence vs hypothesis</text>
  <text x="720" y="573" class="d">severity + confidence · fix options</text>

  <!-- output -->
  <line x1="700" y1="550" x2="604" y2="550" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="40" y="498" width="560" height="104" rx="14" fill="#052e1f" stroke="#10b981" stroke-width="2"/>
  <text x="62" y="532" class="n">📄 Report · ★ rating · decisions for you</text>
  <text x="62" y="558" class="d">Each finding: investigate · validate · propose patch · defer · false positive</text>
  <text x="62" y="580" class="d">Patches only after your per-change approval → re-test → regression check</text>
</svg>
