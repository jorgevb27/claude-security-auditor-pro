<text x="26" y="277" class="t"><tspan fill="#22d3ee">SA-27FDAD</tspan><tspan fill="#cbd5e1">  </tspan><tspan fill="#f87171" font-weight="700">CRITICAL</tspan><tspan fill="#cbd5e1"> </tspan><tspan fill="#fb923c">confirmed</tspan><tspan fill="#cbd5e1">      high    Config: Hardcoded Stripe key in settings</tspan></text>
<text x="26" y="300" class="t"><tspan fill="#22d3ee">SA-F634B4</tspan><tspan fill="#cbd5e1">  </tspan><tspan fill="#fb923c" font-weight="700">HIGH</tspan><tspan fill="#cbd5e1">     </tspan><tspan fill="#fb923c">confirmed</tspan><tspan fill="#cbd5e1">      high    Orders API: Order endpoint missing ownership check (IDOR)</tspan></text>
