<text x="500" y="25" text-anchor="middle" class="t" style="font-size:13px;fill:#64748b">audit_manager.py — findings (real output)</text>
<text x="26" y="70" class="t"><tspan fill="#34d399" font-weight="700">$ </tspan><tspan fill="#f8fafc">python audit_manager.py init --scope scope.json</tspan></text>
<text x="26" y="93" class="t"><tspan fill="#cbd5e1">Scope recorded: .security-audit/scope.json</tspan></text>
<text x="26" y="116" class="t"></text>
<text x="26" y="139" class="t"><tspan fill="#34d399" font-weight="700">$ </tspan><tspan fill="#f8fafc">python audit_manager.py add --title &quot;Hardcoded Stripe key in settings&quot; \</tspan></text>
<text x="26" y="162" class="t"><tspan fill="#64748b" font-weight="700">    --severity critical --component Config --location config/settings.py:12 \</tspan></text>
<text x="26" y="185" class="t"><tspan fill="#64748b" font-weight="700">    --evidence &quot;STRIPE_KEY api_key=sk-live0123456789abcdefghij&quot; --status confirmed</tspan></text>
<text x="26" y="208" class="t"><tspan fill="#cbd5e1">Finding saved: </tspan><tspan fill="#22d3ee">SA-27FDAD</tspan><tspan fill="#cbd5e1"> [</tspan><tspan fill="#f87171" font-weight="700">CRITICAL</tspan><tspan fill="#cbd5e1">] status=</tspan><tspan fill="#fb923c">confirmed</tspan><tspan fill="#cbd5e1"> confidence=high</tspan></text>
<text x="26" y="231" class="t"></text>
